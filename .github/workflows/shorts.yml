name: Daily Finance Short

on:
  schedule:
    - cron: "17 9 * * *"   # Her gun 12:17 (Turkiye saati). Gunde 2 video icin alta bir satir daha ekle: - cron: "47 15 * * *"
  workflow_dispatch:        # Actions sekmesinden "Run workflow" ile elle calistirma

permissions:
  contents: write

concurrency: shorts-bot

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: Altyazi fontu (Anton)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "Font indirilemedi, yedek font kullanilacak"

      - name: Video uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/main.py

      - name: Videoyu Artifacts'e koy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Gecmisi kaydet (ayni konu tekrar etmesin)
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: yeni video" && git push)
